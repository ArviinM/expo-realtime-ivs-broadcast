name: Bug Report
description: Report a bug with expo-realtime-ivs-broadcast
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the details below so we can investigate.

  - type: input
    id: library-version
    attributes:
      label: Library Version
      placeholder: "e.g., 0.2.8"
    validations:
      required: true

  - type: input
    id: expo-sdk
    attributes:
      label: Expo SDK Version
      placeholder: "e.g., 54"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - Android
        - Both
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS Version
      placeholder: "e.g., iOS 17.4 / Android 14"
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Device Type
      options:
        - Physical device
        - Simulator/Emulator
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the issue.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Output
      description: Paste any relevant logs from Metro, Xcode, or Android Studio.
      render: shell

  - type: dropdown
    id: feature-area
    attributes:
      label: Feature Area
      description: Which part of the library is affected?
      options:
        - Stage connection (join/leave)
        - Publishing (camera/mic)
        - Viewing (remote streams)
        - Picture-in-Picture
        - Permissions
        - Other
    validations:
      required: true
